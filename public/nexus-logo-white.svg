<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" fill="none">
  <defs>
    <linearGradient id="logoGradientWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  
  <!-- Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer circle -->
    <circle cx="30" cy="30" r="28" stroke="url(#logoGradientWhite)" stroke-width="2.5" fill="none"/>
    <!-- Connection nodes -->
    <circle cx="30" cy="12" r="5" fill="url(#logoGradientWhite)"/>
    <circle cx="12" cy="40" r="5" fill="url(#logoGradientWhite)"/>
    <circle cx="48" cy="40" r="5" fill="url(#logoGradientWhite)"/>
    <!-- Connection lines forming N -->
    <line x1="30" y1="17" x2="15" y2="35" stroke="url(#logoGradientWhite)" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="17" x2="45" y2="35" stroke="url(#logoGradientWhite)" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="45" x2="45" y2="45" stroke="url(#logoGradientWhite)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Text: NEXUS -->
  <text x="85" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="2" fill="#ffffff">
    NEXUS
  </text>
</svg>
