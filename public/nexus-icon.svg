<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="iconGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="45" stroke="url(#iconGradient)" stroke-width="3" fill="none"/>
  <!-- Connection nodes -->
  <circle cx="50" cy="25" r="8" fill="url(#iconGradient)"/>
  <circle cx="25" cy="65" r="8" fill="url(#iconGradient)"/>
  <circle cx="75" cy="65" r="8" fill="url(#iconGradient)"/>
  <!-- Connection lines forming N -->
  <line x1="50" y1="33" x2="25" y2="57" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="33" x2="75" y2="57" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="25" y1="73" x2="75" y2="73" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round"/>
</svg>
